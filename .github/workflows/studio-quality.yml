name: Studio quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # Missing runtime tools must fail tool-dependent Rust tests in CI.
      DOUBLELOVE_REQUIRE_TEST_TOOLS: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure libass-capable ffmpeg on PATH
        run: |
          if [[ -x /opt/homebrew/bin/brew ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          if ! ffmpeg -hide_banner -filters 2>/dev/null \
            | awk '$2 == "ass" { found=1 } END { exit !found }'; then
            brew install ffmpeg-full
          fi
          # Later GITHUB_PATH entries take priority; add the preferred keg last.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          if [[ -d /opt/homebrew/opt/ffmpeg-full/bin ]]; then
            echo "/opt/homebrew/opt/ffmpeg-full/bin" >> "$GITHUB_PATH"
          fi
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          # action-setup 没有已装检测，每次都会在 dest 里自安装 pnpm；
          # 默认 dest 是 ~/setup-pnpm，会污染 runner 家目录，指到 RUNNER_TEMP（每 job 自动清理）。
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Studio dependencies
        run: pnpm --dir studio install --frozen-lockfile
      - name: Verify test runtime prerequisites
        run: |
          missing=0
          for tool in cargo rustc ffmpeg ffprobe python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'available\t%s\n' "$tool"
            else
              printf 'missing\t%s\n' "$tool"
              missing=1
            fi
          done
          if ! ffmpeg -hide_banner -filters 2>/dev/null |
            awk '$2 == "ass" { found=1 } END { exit !found }'; then
            printf 'missing\tffmpeg filter ass\n'
            missing=1
          else
            printf 'available\tffmpeg filter ass\n'
          fi
          exit "$missing"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build Electron desktop host
        run: cargo build -p double-love-desktop-host --locked
      - name: Build release Electron desktop host
        run: cargo build --release -p double-love-desktop-host --locked
      - name: Check generated bindings and CLI JSON contracts
        run: scripts/migration/check-bindings-contract.sh
      - name: Test ASR sidecar
        run: |
          python3 -m unittest discover \
            -s sidecars/asr/tests -p 'test_*.py'
      - name: Test speaker sidecar
        run: |
          python3 -m unittest discover \
            -s sidecars/speaker/tests -p 'test_*.py'
      - name: Compile sidecar sources
        run: |
          python3 -m py_compile \
            sidecars/asr/double_love_asr/*.py \
            sidecars/speaker/double_love_speaker/*.py
      - name: Test Studio
        run: pnpm --dir studio test
      - name: Lint Studio
        run: pnpm --dir studio lint
      - name: Build Studio
        run: pnpm --dir studio build
      - name: Build Electron application
        run: pnpm --dir studio exec electron-vite build
      - name: Test Electron application
        run: pnpm --dir studio exec playwright test
      - name: Package unpacked Electron application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --dir studio pack:dir
      - name: Smoke packaged Electron application
        run: scripts/migration/package-smoke.sh
      - name: Check whitespace in pushed commits
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$before..${{ github.sha }}"
          else
            git show --check --format=fuller "${{ github.sha }}"
          fi
