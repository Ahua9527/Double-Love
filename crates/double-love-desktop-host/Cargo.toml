[package]
name = "double-love-desktop-host"
version = "0.1.0"
edition = "2024"
description = "Long-running desktop protocol host for Double Love Studio"
license = "MIT"

[dependencies]
double-love-desktop-service = { path = "../double-love-desktop-service" }
