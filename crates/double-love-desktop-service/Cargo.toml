[package]
name = "double-love-desktop-service"
version = "0.1.0"
edition = "2024"
description = "Desktop state and command dispatch service for Double Love Studio"
license = "MIT"

[dependencies]
double-love-engine = { path = "../double-love-engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
sha2 = "0.10"
