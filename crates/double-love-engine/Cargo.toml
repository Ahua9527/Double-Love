[package]
name = "double-love-engine"
version = "0.1.0"
edition = "2024"
description = "Pure Rust business engine for Double Love Studio"
license = "MIT"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
uuid = { version = "1", features = ["serde", "v4"] }
