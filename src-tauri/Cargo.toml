[package]
name = "double-love-tauri"
version = "0.1.0"
edition = "2024"

[lib]
name = "double_love_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
double-love-engine = { path = "../crates/double-love-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
